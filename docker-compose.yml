# Servis Takip - Natro sunucusunda çalışan servisler
#   db    : PostgreSQL 16 (dışarıya kapalı, sadece uygulama erişir)
#   app   : Uygulama (Node.js)
#   caddy : HTTPS sertifikasını otomatik alır ve yeniler, trafiği uygulamaya iletir

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Şema dosyaları uygulama açılırken otomatik uygulanır (db/ klasörü)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Port dışarıya AÇILMAZ.

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OTURUM_GIZLI: ${OTURUM_GIZLI}
      ALAN_ADI: ${ALAN_ADI}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TZ: Europe/Istanbul
      PORT: "3000"
    volumes:
      - dosyalar:/data/dosyalar        # imzalar, fotoğraflar, PDF'ler
      - ./guncelleme:/data/guncelleme  # "Programı güncelle" istekleri (scripts/guncelleme_servisi_kur.sh)
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALAN_ADI: ${ALAN_ADI}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  dosyalar:
  caddy_data:
  caddy_config:
